name: Windows build, checks and release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Build.cmd'
      - 'release-version.txt'
      - 'scripts/**'
      - 'tools/**'
      - 'installer/**'
      - '.gitattributes'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Build and publish the full offline installer after review'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name != 'workflow_dispatch' || !inputs.build_installer
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile review build
        shell: cmd
        run: Build.cmd
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_installer
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build, verify and prepare full offline package
        shell: pwsh
        run: ./scripts/Build-GitHub-Release.ps1
      - name: Publish GitHub download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content release-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag = "v$version"
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { Write-Host 'Published release preserved.'; exit 0 }
            if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Draft belongs to another commit; bump version.' }
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Local AI Launcher $tag" --notes-file release-output/RELEASE_NOTES.md --draft
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem release-output -File | Where-Object { $_.Name -ne 'RELEASE_NOTES.md' } | ForEach-Object { $_.FullName })
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft retained' }
          ./scripts/Publish-Model-Packs.ps1 -Tag $tag
          if (-not $?) { throw 'Model pack publication failed; draft retained' }
          gh release edit $tag --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }


      - name: Refresh release descriptions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Update-Release-Notes.ps1
